changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: "Features"
      labels:
        - enhancement
        - feature
    - title: "Fixes"
      labels:
        - bug
        - fix
    - title: "Documentation & workflow"
      labels:
        - documentation
        - docs
    - title: "Other changes"
      labels:
        - "*"
