name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

      - name: Package sideload build
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p package/sideload
          cp manifest.json README.md LICENSE package/sideload/
          cp -R dist package/sideload/dist
          (
            cd package/sideload
            zip -qr "../figma-agent-source-exporter-v${VERSION}-sideload.zip" .
          )

      - name: Upload sideload package
        uses: actions/upload-artifact@v4
        with:
          name: figma-agent-source-exporter-sideload
          path: package/*-sideload.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish version release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          ASSET="package/figma-agent-source-exporter-v${VERSION}-sideload.zip"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          cat > package/release-notes.md <<'EOF'
          ## Figma Agent Source Exporter v0.1.0

          First standalone release of the Figma Agent Source Exporter.

          ### Included
          - Entire-file, current-page, and selection export modes
          - Exact 1x frame reference renders with optional 2x output
          - Original image-fill extraction
          - SVG export for likely icons and logos
          - Variables, modes, local styles, components, variants, and font-usage inventory
          - Serialized Figma node structure with Auto Layout, constraints, dimensions, fills, effects, and text data
          - Export manifest with extraction warnings
          - Agent handoff README inside every generated source pack
          - No plugin network access; read-only document behavior

          ### Install
          1. Download the attached sideload ZIP.
          2. Extract it.
          3. In Figma Desktop, open **Plugins → Development → Import plugin from manifest…**
          4. Select the extracted `manifest.json`.
          5. Run **Agent Source Exporter**.

          Start with **1x exact** reference renders for normal coding-agent handoff.
          EOF

          gh release create "$TAG" "$ASSET#Figma Agent Source Exporter v${VERSION} — sideload ZIP"             --target "$GITHUB_SHA"             --title "Figma Agent Source Exporter v${VERSION}"             --notes-file package/release-notes.md
