name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

      - name: Package sideload build
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p package/sideload
          cp manifest.json README.md LICENSE package/sideload/
          cp -R dist package/sideload/dist
          (
            cd package/sideload
            zip -qr "../figma-agent-source-exporter-v${VERSION}-sideload.zip" .
          )

      - name: Upload sideload package
        uses: actions/upload-artifact@v4
        with:
          name: figma-agent-source-exporter-sideload
          path: package/*-sideload.zip
          if-no-files-found: error
          retention-days: 30
