name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Validate license metadata and attribution
        shell: bash
        run: |
          node -e "if (require('./package.json').license !== 'MIT') process.exit(1)"
          grep -Fxq 'MIT License' LICENSE
          grep -Fxq 'Copyright (c) 2025 Graham Lipsman' LICENSE
          grep -Fxq 'Copyright (c) 2026 Ibrahim Elrouby (original contributions)' LICENSE
          test -s THIRD_PARTY_NOTICES.md

      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

      - name: Package sideload build
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p package/sideload
          cp manifest.json README.md LICENSE THIRD_PARTY_NOTICES.md package/sideload/
          cp -R dist package/sideload/dist
          (
            cd package/sideload
            zip -qr "../figma-to-agent-v${VERSION}-sideload.zip" .
          )
          unzip -Z1 "package/figma-to-agent-v${VERSION}-sideload.zip" | grep -Fxq LICENSE
          unzip -Z1 "package/figma-to-agent-v${VERSION}-sideload.zip" | grep -Fxq THIRD_PARTY_NOTICES.md

      - name: Upload sideload package
        uses: actions/upload-artifact@v4
        with:
          name: figma-to-agent-sideload
          path: package/*-sideload.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish version release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          ASSET="package/figma-to-agent-v${VERSION}-sideload.zip"
          NOTES="docs/releases/v${VERSION}.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          if [ ! -f "$NOTES" ]; then
            echo "Missing curated release notes: $NOTES"
            echo "Every version must ship with product-facing release notes."
            exit 1
          fi

          gh release create "$TAG" "$ASSET#Figma → Agent v${VERSION} — sideload ZIP" \
            --target "$GITHUB_SHA" \
            --title "Figma → Agent v${VERSION}" \
            --notes-file "$NOTES"
